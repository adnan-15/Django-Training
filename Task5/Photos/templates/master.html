<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Website Name</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .nav-btn {
        transition: all 0.3s ease;
      }

      .nav-btn:hover {
        transform: translateY(-3px);
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 text-white flex flex-col"
  >
    <!-- Header -->
    <header class="text-center pt-10 pb-6 px-4">
      <!-- Website Name -->
      <h1
        class="text-4xl md:text-5xl font-extrabold tracking-wide bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent"
      >
        TASK 5
      </h1>

      <p class="mt-3 text-gray-400">Welcome to our creative website</p>

      
      <nav class="flex justify-center flex-wrap gap-4 mt-8">

    <a href="{% url 'home' %}"
       class="px-7 py-3 rounded-xl bg-cyan-500/10
              border border-cyan-400/40 text-cyan-300
              hover:bg-cyan-400 hover:text-slate-950
              hover:scale-105 transition duration-300">
        Home
    </a>

    <a href="{% url 'about' %}"
       class="px-7 py-3 rounded-xl bg-purple-500/10
              border border-purple-400/40 text-purple-300
              hover:bg-purple-400 hover:text-slate-950
              hover:scale-105 transition duration-300">
        About
    </a>

    <a href="{% url 'info' %}"
       class="px-7 py-3 rounded-xl bg-pink-500/10
              border border-pink-400/40 text-pink-300
              hover:bg-pink-400 hover:text-slate-950
              hover:scale-105 transition duration-300">
        Info
    </a>

</nav>

    </header>

    {% block content %} {% endblock %}
    <!-- Footer -->
    <footer class="border-t border-white/10 bg-black/20 text-center py-6">
      <p class="text-gray-400 text-sm">© Copyright Iram Khan</p>
    </footer>
  </body>
</html>
