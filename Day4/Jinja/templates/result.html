<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Result of {{name}}</h1>
    </div>
    <div>
        {% if marks >= 80 %}
            <h2>Grade: A</h2>
        {% elif marks >= 70 %}
            <h2>Grade: B</h2>
        {% elif marks >= 60 %}
            <h2>Grade: C</h2>
        {% elif marks >= 50 %}
            <h2>Grade: D</h2>
        {% else %}
            <h2>Grade: F</h2>
        {% endif %}
    </div>
</body>
</html>
