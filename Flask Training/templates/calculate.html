<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class=" text-center items-center bg-sky-500 flex flex-col text-xl mt-10 ">
    <h1>Calculate average marks</h1>
    <form action="{{ url_for('calculate') }}" method="post" class=" flex items-start flex-col ">
        <div>
            <label for="maths">Maths</label>
            <input type="text" name="maths" placeholder="maths" required>
        </div>
        <div>
            <label for="iot">IOT</label>
            <input type="text" name="iot" placeholder="iot" required>
        </div>
        <div>
            <label for="chemistry">CHEMISTRY</label>
            <input type="text" name="chemistry" placeholder="chemistry" required >
        </div>
        <button class=" text-white bg-blue-600 p-5 rounded ">Calculate Marks</button>
    </form>
</body>
</html>
