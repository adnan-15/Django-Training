<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductList</title>
</head>
<body>
    <div>
        <h1>Product List</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>pid</th>
                <th>Product Name</th>
                <th>Product Price</th>
                <th>Product Offer</th>
            </tr>
            {%  for i in plist %}
            <tr>
                <td><a href="href://localhost:8000/myday/updateproductlist/?id={{ i.id }}">{{i.id}}</a></td>
                <td>{{ i.p_id }}</td>
                <td>{{ i.p_name }}</td>
                <td>{{ i.p_price }}</td>
                <td>{{ i.p_offer }}</td>
                <td><a href="http://localhost:8000/myday/deleteProduct/?id={{i.id}}">delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
