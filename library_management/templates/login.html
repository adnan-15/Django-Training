<!-- Font & Icon Dependencies -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">

<!-- Background Container Wrapper -->
<div style="min-height: 90vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; padding: 20px; box-sizing: border-box;">
  
  <!-- Login Card -->
  <div style="background: #ffffff; max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; padding: 40px 32px; box-sizing: border-box;">
    
    <!-- Header Block -->
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="background-color: #e0e7ff; color: #4f46e5; width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 16px auto;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="margin: 0; font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em;">Welcome Back</h2>
      <p style="margin: 6px 0 0 0; font-size: 14px; color: #64748b;">Sign in to access your library system dashboard</p>
    </div>

    <!-- Dynamic Error Alert Banner (Only renders if 'error' variable contains text) -->
    {% if error %}
    <div style="display: flex; align-items: center; gap: 10px; background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 24px; font-weight: 500;">
      <i class="fa-solid fa-circle-exclamation" style="color: #dc2626;"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Input Group: Username -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 600; color: #475569;">Username</label>
        <div style="position: relative; display: flex; align-items: center;">
          <i class="fa-regular fa-id-badge" style="position: absolute; left: 14px; color: #94a3b8; font-size: 15px;"></i>
          <input name="username" placeholder="Enter username" required 
            style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff; transition: border-color 0.2s;">
        </div>
      </div>

      <!-- Input Group: Password -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="font-size: 13px; font-weight: 600; color: #475569;">Password</label>
        </div>
        <div style="position: relative; display: flex; align-items: center;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 14px; color: #94a3b8; font-size: 15px;"></i>
          <input name="password" type="password" placeholder="Enter password" required 
            style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff; transition: border-color 0.2s;">
        </div>
      </div>

      <!-- Submit Button -->
      <button class="blue" type="submit" 
        style="width: 100%; background-color: #4f46e5; color: #ffffff; border: none; padding: 12px 24px; border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); transition: background-color 0.2s; margin-top: 8px;">
        Sign In
      </button>
    </form>

    <!-- Footer Redirect Link -->
    <div style="margin-top: 28px; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 20px;">
      <p style="margin: 0; font-size: 14px; color: #64748b;">
        New to the tracker? 
        <a href="/signup" style="color: #4f46e5; text-decoration: none; font-weight: 600; margin-left: 4px;">Create New Account</a>
      </p>
    </div>

  </div>
</div>
