<!-- Font & Icon Dependencies -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">

<!-- Background Container Wrapper -->
<div style="min-height: 90vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; padding: 20px; box-sizing: border-box;">
  
  <!-- Welcome Portal Card -->
  <div style="background: #ffffff; max-width: 440px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; padding: 48px 40px; text-align: center; box-sizing: border-box;">
    
    <!-- Hero Branding Element -->
    <div style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #ffffff; width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 24px auto; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <!-- Header Block -->
    <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; line-height: 1.2;">Library Management<br>System</h2>
    <p style="margin: 10px 0 36px 0; font-size: 14px; color: #64748b; line-height: 1.5;">Access, track, and manage student book distributions and record catalogs securely.</p>
    
    <!-- Navigation Portal Actions -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      
      <!-- Login Button -->
      <a href="/login" style="display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #4f46e5; color: #ffffff; padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); transition: transform 0.15s ease;">
        <i class="fa-solid fa-right-to-bracket" style="font-size: 14px;"></i> Sign In to Portal
      </a>
      
      <!-- Registration Button -->
      <a href="/signup" style="display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #ffffff; border: 1px solid #cbd5e1; color: #334155; padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: 15px; transition: background-color 0.15s ease;">
        <i class="fa-solid fa-user-plus" style="color: #64748b; font-size: 14px;"></i> Create New Account
      </a>
      
    </div>
    
    <!-- Footnote Meta Info -->
    <div style="margin-top: 40px; font-size: 11px; color: #94a3b8; letter-spacing: 0.02em; border-top: 1px solid #f1f5f9; padding-top: 20px;">
      Authorized Academic Access Only
    </div>

  </div>
</div>
