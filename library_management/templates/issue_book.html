<!-- Font & Icon Dependencies -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">

<!-- Background Container Wrapper -->
<div style="min-height: 90vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; padding: 40px 20px; box-sizing: border-box;">
  
  <!-- Form Card Box -->
  <div style="background: #ffffff; max-width: 600px; width: 100%; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; padding: 40px; box-sizing: border-box;">
    
    <!-- Header Block Container -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; border-bottom: 1px solid #f1f5f9; padding-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="background-color: #e0e7ff; color: #4f46e5; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
          <i class="fa-solid fa-book-medical"></i>
        </div>
        <div>
          <h2 style="margin: 0; font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em;">Book Issue Form</h2>
          <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Distribute a library asset to an authorized student</p>
        </div>
      </div>
    </div>

    <!-- Form Layout Matrix -->
    <form method="post" style="display: flex; flex-direction: column; gap: 24px;">
      
      <!-- Section: Asset Details -->
      <div>
        <h4 style="margin: 0 0 14px 0; font-size: 12px; font-weight: 700;  color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase;">1. Book Information</h4>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <!-- Book ID -->
          <div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 1;">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Book ID</label>
            <div style="position: relative; display: flex; align-items: center;">
              <i class="fa-solid fa-hashtag" style="position: absolute; left: 14px; color: #94a3b8; font-size: 14px;"></i>
              <input name="book_id" placeholder="Enter book ID" required 
                style="width: 100%; padding: 11px 14px 11px 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>
          </div>
          
          <!-- Book Number -->
          <div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 1;">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Book Number / Shelf Code</label>
            <div style="position: relative; display: flex; align-items: center;">
              <i class="fa-regular fa-bookmark" style="position: absolute; left: 14px; color: #94a3b8; font-size: 14px;"></i>
              <input name="book_number" placeholder="Enter book number" required 
                style="width: 100%; padding: 11px 14px 11px 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>
          </div>

          <!-- Book Name -->
          <div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2;">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Book Name</label>
            <div style="position: relative; display: flex; align-items: center;">
              <i class="fa-solid fa-book" style="position: absolute; left: 14px; color: #94a3b8; font-size: 14px;"></i>
              <input name="book_name" placeholder="Enter book name" required 
                style="width: 100%; padding: 11px 14px 11px 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>
          </div>
        </div>
      </div>

      <!-- Section: Student Details -->
      <div>
        <h4 style="margin: 0 0 14px 0; font-size: 12px; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase;">2. Allocation Details</h4>
        
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Student Name -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Name of Student</label>
            <div style="position: relative; display: flex; align-items: center;">
              <i class="fa-regular fa-user" style="position: absolute; left: 14px; color: #94a3b8; font-size: 14px;"></i>
              <input name="student_name" placeholder="Enter student name" required 
                style="width: 100%; padding: 11px 14px 11px 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>
          </div>

          <!-- Dates Grid Layout -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <!-- Issue Date -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 13px; font-weight: 600; color: #475569;">Issue Date</label>
              <input name="issue_date" type="date" required 
                style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>

            <!-- Due Date -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 13px; font-weight: 600; color: #475569;">Due Date</label>
              <input name="due_date" type="date" required 
                style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; color: #0f172a; box-sizing: border-box; outline: none; background-color: #fff;">
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel Buttons -->
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
        <button type="submit" 
          style="width: 100%; background-color: #4f46e5; color: #ffffff; border: none; padding: 12px 24px; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); transition: background-color 0.2s;">
          Issue Asset
        </button>
        
        <a href="/dashboard" style="display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #ffffff; border: 1px solid #e2e8f0; color: #475569; padding: 11px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 14px; transition: background-color 0.2s;">
          <i class="fa-solid fa-arrow-left" style="font-size: 13px; color: #94a3b8;"></i> Back to Dashboard
        </a>
      </div>
    </form>

  </div>
</div>
