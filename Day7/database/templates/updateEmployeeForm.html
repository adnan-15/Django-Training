<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="{% url 'updateEmployee' %}" method="post">
        {% csrf_token %}

        <input type="hidden" name="id" value="{{employee.id}}">
        <div>
            <label for="e_no">Employee Number</label>
        </div>
        <div>
            <input type="text" name="e_no" id="e_no" value="{{employee.e_no}}">
        </div>

        <div>
            <label for="e_name">Employee Name</label>
        </div>
        <div>
            <input type="text" name="e_name" id="e_name" value="{{employee.e_name}}">
        </div>

        <div>
            <label for="e_salary">Employee salary</label>
        </div>
        <div>
            <input name="e_salary" id="e_salary" value="{{employee.e_salary}}">
        </div>

        <div><input type="submit" value="update"></div>


    </form>
</body>
</html>
