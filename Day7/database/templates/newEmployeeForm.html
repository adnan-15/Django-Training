<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="{% url 'saveuser' %}" method="post">
        {% csrf_token %}
        <div>
            <label for="e_no">Employee number</label>
            <input type="number" name="e_no" >
        </div>
        
        <div>
            <label for="e_name">Employee name</label>
            <input type="text" name="e_name" id="e_name">
        </div>
        
        <div>
            <label for="e_salary">Employee salary</label>
            <input type="text" name="e_salary" id="e_salary">
        </div>

        <button>submit form</button>
    </form>
</body>
</html>
