<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeList</title>
</head>
<body>
    <div>
        <h1>Emplyee List</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Employee No.</th>
                <th>Emplyoyee Name</th>
                <th>Employee Salary</th>
            </tr>
            {%  for i in Employees %}
            <tr>
                <td><a href="http://localhost:8000/database/updateEmployeeform/?id={{i.id}}">{{ i.id }}</a></td>
                <td>{{ i.e_no }}</td>
                <td>{{ i.e_name }}</td>
                <td>{{ i.e_salary }}</td>
                <td><a href="http://localhost:8000/database/deleteEmployee/?id={{i.id}}">delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
